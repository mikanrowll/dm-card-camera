<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カメラ試験</title>
<style>
  body{margin:0;padding:12px;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#111;color:#eee}
  h1{font-size:16px;margin:0 0 8px}
  .video-wrap{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;position:relative}
  video{width:100%;height:100%;object-fit:contain;display:block}
  .state{position:absolute;left:8px;top:8px;background:#000a;padding:2px 8px;border-radius:10px;font-size:12px}
  .btns{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
  button{flex:1;min-width:90px;padding:12px;font-size:15px;border:0;border-radius:8px;background:#2f6fed;color:#fff}
  button.sub{background:#444}
  button:disabled{opacity:.4}
  pre{background:#000;border:1px solid #333;border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:38vh;overflow:auto}
  .ok{color:#6fe38a}.ng{color:#ff7b7b}
</style>
</head>
<body>
<h1>カメラ動作確認(試験ページ)</h1>
<div class="video-wrap">
  <video id="v" playsinline muted autoplay></video>
  <div class="state" id="state">停止中</div>
</div>
<div class="btns">
  <button id="start">開始</button>
  <button id="stop" class="sub" disabled>停止</button>
  <button id="restart" class="sub" disabled>再開</button>
</div>
<div class="btns">
  <button id="copy" class="sub">結果をコピー</button>
  <button id="reload" class="sub">再読み込み</button>
</div>
<pre id="log"></pre>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const v = $('v'), logEl = $('log');
  let stream = null, busy = false;
  const lines = [];

  function log(msg, cls) {
    const t = new Date().toTimeString().slice(0, 8);
    lines.push(t + ' ' + msg);
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = t + ' ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setState(s) { $('state').textContent = s; }
  function buttons() {
    const on = !!stream;
    $('start').disabled = on || busy;
    $('stop').disabled = !on;
    $('restart').disabled = busy || !on;
  }

  // 起動回数をブラウザに記録(使えない環境では無視)
  function bumpCount() {
    try {
      const n = Number(localStorage.getItem('camTestRuns') || 0) + 1;
      localStorage.setItem('camTestRuns', String(n));
      return n;
    } catch (e) { return null; }
  }

  function diag() {
    log('UserAgent: ' + navigator.userAgent);
    log('HTTPS(安全なページ): ' + window.isSecureContext, window.isSecureContext ? 'ok' : 'ng');
    log('mediaDevices: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
        (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? 'ok' : 'ng');
    log('フレーム内で動作: ' + (window.top !== window.self));
    try {
      const pp = document.permissionsPolicy || document.featurePolicy;
      if (pp && pp.allowsFeature) log('カメラ許可(ページ設定): ' + pp.allowsFeature('camera'), pp.allowsFeature('camera') ? 'ok' : 'ng');
      else log('カメラ許可(ページ設定): この端末では確認不可');
    } catch (e) { log('ページ設定の確認に失敗: ' + e.message); }
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'camera' }).then(
        (r) => log('カメラ権限の状態: ' + r.state),
        () => log('カメラ権限の状態: 確認不可'));
    }
    const n = bumpCount();
    if (n !== null) log('このページを開いた回数: ' + n);
  }

  async function start() {
    if (busy || stream) return;
    busy = true; buttons(); setState('起動中…');
    try {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        throw Object.assign(new Error('この環境ではカメラAPIを使えません'), { name: 'NoMediaDevices' });
      }
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      v.srcObject = stream;
      await v.play().catch((e) => log('再生開始の警告: ' + e.name));
      const tr = stream.getVideoTracks()[0];
      const st = tr.getSettings ? tr.getSettings() : {};
      log('起動成功: ' + (tr.label || '(名前なし)'), 'ok');
      log('向き(facingMode): ' + (st.facingMode || '不明') + ' / 解像度: ' + (st.width || '?') + '×' + (st.height || '?'));
      tr.addEventListener('ended', () => { log('映像が外部要因で停止しました', 'ng'); release(); });
      v.addEventListener('loadedmetadata', function once() {
        v.removeEventListener('loadedmetadata', once);
        log('映像サイズ: ' + v.videoWidth + '×' + v.videoHeight);
      });
      setState('撮影中');
    } catch (e) {
      stream = null;
      log('起動失敗: ' + e.name + ' / ' + e.message, 'ng');
      hint(e);
      setState('失敗');
    } finally {
      busy = false; buttons();
    }
  }

  function hint(e) {
    const m = {
      NotAllowedError: '権限が拒否されました。端末側の許可、またはこのページの埋め込み設定でカメラが禁止されている可能性があります。',
      NotFoundError: 'カメラが見つかりません。',
      NotReadableError: '他のアプリがカメラを使用中の可能性があります。',
      OverconstrainedError: '指定した条件のカメラがありません。',
      NoMediaDevices: 'カメラAPIが使えない環境です(埋め込みの制限または非HTTPS)。',
      SecurityError: 'セキュリティ制限で拒否されました。'
    };
    if (m[e.name]) log('→ ' + m[e.name]);
  }

  function release() {
    if (stream) { stream.getTracks().forEach((t) => t.stop()); }
    stream = null;
    v.srcObject = null;
    setState('停止中');
    buttons();
  }

  function stop() { if (!stream) return; release(); log('停止しました(カメラを解放)'); }

  async function restart() {
    if (busy) return;
    log('再開: 一度停止してから起動し直します');
    release();
    await start();
  }

  $('start').onclick = start;
  $('stop').onclick = stop;
  $('restart').onclick = restart;
  $('reload').onclick = () => { release(); location.reload(); };
  $('copy').onclick = async () => {
    const text = lines.join('\n');
    try { await navigator.clipboard.writeText(text); log('結果をコピーしました', 'ok'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); log('結果をコピーしました', 'ok'); } catch (e2) { log('コピーできませんでした。ログを長押しで選択してください', 'ng'); }
      ta.remove();
    }
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) { log('画面が隠れたため停止します'); release(); } });
  window.addEventListener('pagehide', release);

  diag();
  buttons();
})();
</script>
</body>
</html>
